<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI-compatible speech-to-text workflow in Daytona</title>
  <desc id="desc">Diagram showing media files processed in a Daytona workspace by Sapat and sent to an OpenAI-compatible transcription endpoint.</desc>
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <rect x="72" y="84" width="1136" height="552" rx="24" fill="#ffffff" stroke="#d8dde8" stroke-width="2"/>
  <text x="110" y="148" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#162033">OpenAI-compatible STT with Daytona and Sapat</text>
  <text x="110" y="188" font-family="Arial, sans-serif" font-size="20" fill="#4b5565">A reproducible workspace keeps media tooling, Python code, and provider configuration isolated.</text>

  <rect x="110" y="258" width="220" height="140" rx="16" fill="#eaf2ff" stroke="#7aa7e8" stroke-width="2"/>
  <text x="146" y="318" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17406f">Media file</text>
  <text x="146" y="354" font-family="Arial, sans-serif" font-size="18" fill="#17406f">mp4, mp3, wav</text>

  <rect x="430" y="236" width="420" height="184" rx="18" fill="#eef8f4" stroke="#64b894" stroke-width="2"/>
  <text x="474" y="294" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#165a42">Daytona workspace</text>
  <text x="474" y="330" font-family="Arial, sans-serif" font-size="18" fill="#25644e">Sapat converts audio, loads .env,</text>
  <text x="474" y="358" font-family="Arial, sans-serif" font-size="18" fill="#25644e">and dispatches the provider request.</text>
  <rect x="474" y="382" width="170" height="44" rx="8" fill="#ffffff" stroke="#9bd4bb"/>
  <text x="508" y="411" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#165a42">openai_compatible</text>

  <rect x="950" y="258" width="220" height="140" rx="16" fill="#fff3df" stroke="#e0a34b" stroke-width="2"/>
  <text x="982" y="314" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#765018">STT endpoint</text>
  <text x="982" y="350" font-family="Arial, sans-serif" font-size="18" fill="#765018">/v1/audio/transcriptions</text>

  <path d="M342 328 H410" stroke="#526071" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M862 328 H930" stroke="#526071" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1058 412 C1058 520 330 520 224 414" stroke="#526071" stroke-width="4" fill="none" stroke-dasharray="10 10" marker-end="url(#arrow)"/>

  <text x="360" y="308" font-family="Arial, sans-serif" font-size="18" fill="#526071">convert</text>
  <text x="878" y="308" font-family="Arial, sans-serif" font-size="18" fill="#526071">POST</text>
  <text x="520" y="554" font-family="Arial, sans-serif" font-size="18" fill="#526071">transcript.txt written beside the source file</text>

  <rect x="178" y="462" width="924" height="66" rx="12" fill="#f2f4f8" stroke="#d8dde8"/>
  <text x="216" y="504" font-family="Arial, sans-serif" font-size="18" fill="#334155">Configuration: OPENAI_COMPAT_STT_BASE_URL, API_KEY, MODEL, AUTH_HEADER, AUTH_PREFIX</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526071"/>
    </marker>
  </defs>
</svg>
